# catch-all (redirect to home page)
server {
    server_name ~^(?:[\w-]+\.)+nanpa\.la$;
    listen 443 ssl;
    location / { return https://ijo.tan.anpa.nanpa.la$request_uri; }
}

# root domain
server {
    server_name nanpa.la;
    listen 443 ssl;

    # host static content
    location /kiwen/ {
        root /var/www/nanpa-la/html/kiwen;
        expires 5d; # TODO: increase to prob 30d
        access_log off;
        add_header Cache-Control "public";
    }

    # redirect
    location / { return https://ijo.tan.anpa.nanpa.la$request_uri; }
}

# home page
server {
    server_name ijo.tan.anpa.nanpa.la;
    listen 443 ssl;
    location / {
        root /var/www/nanpa-la/html/itan;
        try_files $uri $uri/ =404;
    }
}

