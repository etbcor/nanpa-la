<body>
  <style>
    @font-face {
      font-family: 'nasin-nanpa';
      src: url('/ijo/nasin-nanpa.otf');
    }

    html {
      background-color: #354;
      overflow: hidden;
    }

    #selo {
      margin: auto;
      margin-top: 25px;
      width: fit-content;
      border: 10px black solid;
      border-radius: 100px;
      background: #ABC;
      box-shadow: black 6px 10px;
    }

    #selo::after {
      content: "";
      display: block;
      position: absolute;
      height: 20px;
      width: 200%;
      z-index: -1;
      border: 10px black solid;
      transform: translate(-50%, -50px);
      background-image: linear-gradient(to bottom, #E98, #C75);
    }

    #selo div {
      margin: 20px;
      width: 100px;
      aspect-ratio: 1;
      border: 10px black solid;
      border-radius: 100%;
      cursor: pointer;
    }

    #wan   { background: #F00; }
    #tu    { background: #FF0; }
    #tuwan { background: #0F0; }
    #opona { background: #0FF;
      font-family: "nasin-nanpa";
      font-size: 45px;
      padding-top: 50px;
    }
  </style>

  <script src="/ijo/nasa.js"></script>
  <script>
  let nanpaTawa = 0;
  function o(nimi) {
    const ijo = document.getElementById(nimi);
    const suli = ijo.style.scale ? ijo.style.scale : 1;
    const suliSin = suli > 0.2 ? suli * 0.5 : 0;
    const nanpa = (Math.random() * screen.height) / 4;

    ijo.style.scale = suliSin;
    ijo.style.marginTop = `${nanpa}px`;

    if (suliSin == 0) {
      ijo.style.display = "none";
      nanpaTawa++;
    }

    if (nanpaTawa > 2) {
      const oPona = document.getElementById("opona");
      oPona.style.display = "block";
      setTimeout(() => {
        nasa();
      }, 1000);
    }
  }
  </script>

  <div id="selo" class="kule">
    <div id="wan" onclick="o('wan')"></div>
    <div id="tu" onclick="o('tu')"></div>
    <div id="tuwan" onclick="o('tuwan')"></div>
    <div id="opona" class="nn" style="display: none"><span>opona</span></div>
  </div>
</body>
